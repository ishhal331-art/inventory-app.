<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Login</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen text-white">
<div class="bg-slate-800 p-6 rounded-xl w-full max-w-md">
<h1 class="text-2xl font-bold mb-4">Inventory Management</h1>
<input id="u" class="w-full p-2 text-black mb-3" value="admin">
<input id="p" type="password" class="w-full p-2 text-black mb-3" value="admin123">
<button onclick="login()" class="bg-emerald-600 px-4 py-2 rounded w-full">Login</button>
<p id="msg" class="mt-4 text-sm"></p>
</div>
<script>
const API_BASE="https://inventory-app-130s.onrender.com/api";
async function login(){
 const res=await fetch(API_BASE+"/auth/login",{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({username:u.value,password:p.value})
 });
 const txt=await res.text();
 try{
   const data=JSON.parse(txt);
   if(res.ok){
      localStorage.setItem("token",data.token);
      msg.innerHTML="<span style='color:lightgreen'>Login successful.</span>";
   }else{
      msg.textContent=data.error;
   }
 }catch(e){
   msg.innerHTML="<span style='color:#f87171'>Backend returned HTML instead of JSON. Check your Render deployment.</span>";
 }
}
</script>
</body></html>
