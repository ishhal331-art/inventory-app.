<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background:#0f1220; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a2f45; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none; } }

<body class="text-slate-200">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

// ---------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------
const API_BASE = window.__INVENTORY_API__ || "https://inventory-app-130s.onrender.com";
const CATEGORY_COLORS = { Laptop:"#ec4899", Mouse:"#8b5cf6", Watch:"#10b981", Mobile:"#d946ef", Headphone:"#f59e0b" };

function eur(n) {
  return new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(Number(n) || 0);
}

// ---------------------------------------------------------------------
// API helper
// ---------------------------------------------------------------------
function useApi(token) {
  return useMemo(() => {
    async function call(path, opts = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
          ...(opts.headers || {}),
        },
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      if (!res.ok) {
        let msg = "Request failed";
        try { msg = (await res.json()).error || msg; } catch (e) {}
        throw new Error(msg);
      }
      const ct = res.headers.get("content-type") || "";
      return ct.includes("application/json") ? res.json() : res.text();
    }
    return {
      login: (username, password) => call("/auth/login", { method: "POST", body: { username, password } }),
      dashboard: () => call("/dashboard"),
      products: (qs = "") => call(`/products${qs}`),
      createProduct: (data) => call("/products", { method: "POST", body: data }),
      updateProduct: (id, data) => call(`/products/${id}`, { method: "PUT", body: data }),
      deleteProduct: (id) => call(`/products/${id}`, { method: "DELETE" }),
      bulkImportProducts: (products) => call("/products/bulk-import", { method: "POST", body: { products } }),
      bulkDeleteProducts: (ids) => call("/products/bulk-delete", { method: "POST", body: { ids } }),
      stockAction: (id, action, data) => call(`/inventory/${id}/${action}`, { method: "POST", body: data }),
      warehouses: () => call("/warehouses"),
      createWarehouse: (data) => call("/warehouses", { method: "POST", body: data }),
      updateWarehouse: (id, data) => call(`/warehouses/${id}`, { method: "PUT", body: data }),
      deleteWarehouse: (id) => call(`/warehouses/${id}`, { method: "DELETE" }),
      suppliers: () => call("/suppliers"),
      createSupplier: (data) => call("/suppliers", { method: "POST", body: data }),
      updateSupplier: (id, data) => call(`/suppliers/${id}`, { method: "PUT", body: data }),
      deleteSupplier: (id) => call(`/suppliers/${id}`, { method: "DELETE" }),
      dispatchers: () => call("/dispatchers"),
      createDispatcher: (data) => call("/dispatchers", { method: "POST", body: data }),
      updateDispatcher: (id, data) => call(`/dispatchers/${id}`, { method: "PUT", body: data }),
      deleteDispatcher: (id) => call(`/dispatchers/${id}`, { method: "DELETE" }),
      purchaseOrders: () => call("/purchase-orders"),
      createPO: (data) => call("/purchase-orders", { method: "POST", body: data }),
      approvePO: (id) => call(`/purchase-orders/${id}/approve`, { method: "PUT" }),
      receivePO: (id) => call(`/purchase-orders/${id}/receive`, { method: "PUT" }),
      notifications: () => call("/notifications"),
      activityLogs: () => call("/activity-logs"),
      transactions: (qs = "") => call(`/transactions${qs}`),
    };
  }, [token]);
}

// ---------------------------------------------------------------------
// Login Screen
// ---------------------------------------------------------------------
function Login({ onLogin }) {
  const api = useApi(null);
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [username, setUsername] = useState("admin");
  const [password, setPassword] = useState("admin123");
  const [signupEmail, setSignupEmail] = useState("");
  const [signupResult, setSignupResult] = useState(null);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function submitLogin(e) {
    e.preventDefault();
    setError(""); setLoading(true);
    try {
      const { token, user } = await api.login(username, password);
      onLogin(token, user);
    } catch (err) {
      setError(err.message || "Could not connect to the API. Is the backend running?");
    } finally { setLoading(false); }
  }

  async function submitSignup(e) {
    e.preventDefault();
    setError(""); setLoading(true); setSignupResult(null);
    try {
      const res = await fetch(`${API_BASE}/auth/signup`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: signupEmail }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not send invite");
      setSignupResult(data);
    } catch (err) { setError(err.message); } finally { setLoading(false); }
  }

  return (
    <div className="min-h-screen w-full flex items-center justify-center relative overflow-hidden"
         style={{ background: "radial-gradient(circle at 20% 20%, #1c2140 0%, #0b0d18 60%)" }}>
      <div className="absolute -top-32 -left-32 w-96 h-96 rounded-full opacity-30 blur-3xl" style={{ background: "linear-gradient(135deg,#7c3aed,#ec4899)" }}></div>
      <div className="absolute -bottom-32 -right-20 w-96 h-96 rounded-full opacity-20 blur-3xl" style={{ background: "linear-gradient(135deg,#06b6d4,#22c55e)" }}></div>

      <div className="relative z-10 glass border border-white/10 rounded-2xl p-8 w-[380px] shadow-2xl fade-in">
        <div className="flex items-center gap-2 mb-1">
          <div className="w-9 h-9 rounded-lg flex items-center justify-center text-white font-bold" style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>IN</div>
          <span className="text-xl font-semibold tracking-tight">Inventory</span>
        </div>

        <div className="flex gap-4 mt-4 mb-5 border-b border-white/10 text-sm">
          <button onClick={()=>{setMode("login"); setError(""); setSignupResult(null);}} className={`pb-2 -mb-px border-b-2 transition ${mode==="login" ? "border-emerald-400 text-white" : "border-transparent text-slate-500"}`}>Log in</button>
          <button onClick={()=>{setMode("signup"); setError(""); setSignupResult(null);}} className={`pb-2 -mb-px border-b-2 transition ${mode==="signup" ? "border-emerald-400 text-white" : "border-transparent text-slate-500"}`}>Sign up</button>
        </div>

        {mode === "login" && (
          <form onSubmit={submitLogin}>
            <p className="text-slate-400 text-sm mb-5">Sign in to manage stock, warehouses & suppliers.</p>
            <label className="text-xs uppercase tracking-wide text-slate-400">Username or email</label>
            <input value={username} onChange={e=>setUsername(e.target.value)}
              className="w-full mt-1 mb-4 px-3 py-2.5 rounded-lg bg-white/5 border border-white/10 focus:border-emerald-400 text-sm" />
            <label className="text-xs uppercase tracking-wide text-slate-400">Password</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)}
              className="w-full mt-1 mb-2 px-3 py-2.5 rounded-lg bg-white/5 border border-white/10 focus:border-emerald-400 text-sm" />
            {error && <div className="text-rose-400 text-xs mt-2 mb-1">{error}</div>}
            <button disabled={loading} className="w-full mt-5 py-2.5 rounded-lg font-medium text-sm text-white transition hover:opacity-90 disabled:opacity-60"
              style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>
              {loading ? "Signing in…" : "Sign In"}
            </button>
            <div className="mt-5 text-[11px] text-slate-500 leading-relaxed border-t border-white/10 pt-3">
              Demo accounts — <span className="text-slate-300">admin / admin123</span> (full access) or{" "}
              <span className="text-slate-300">manager / manager123</span> (operations only).
            </div>
          </form>
        )}

        {mode === "signup" && !signupResult && (
          <form onSubmit={submitSignup}>
            <p className="text-slate-400 text-sm mb-5">Enter your work email — we'll send you a link to create your password.</p>
            <label className="text-xs uppercase tracking-wide text-slate-400">Email address</label>
            <input type="email" required value={signupEmail} onChange={e=>setSignupEmail(e.target.value)} placeholder="name@company.com"
              className="w-full mt-1 mb-2 px-3 py-2.5 rounded-lg bg-white/5 border border-white/10 focus:border-emerald-400 text-sm" />
            {error && <div className="text-rose-400 text-xs mt-2 mb-1">{error}</div>}
            <button disabled={loading} className="w-full mt-5 py-2.5 rounded-lg font-medium text-sm text-white transition hover:opacity-90 disabled:opacity-60"
              style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>
              {loading ? "Sending…" : "Send me a signup link"}
            </button>
          </form>
        )}

        {mode === "signup" && signupResult && (
          <div className="text-sm">
            <p className="text-emerald-400 mb-2">✓ {signupResult.message}</p>
            {!signupResult.emailSent && signupResult.devInviteLink && (
              <div className="mt-3 p-3 rounded-lg bg-white/5 border border-white/10 text-xs break-all">
                <p className="text-slate-400 mb-1">Email isn't configured on this server yet — use this link to test:</p>
                <a className="text-emerald-400 underline" href={signupResult.devInviteLink}>{signupResult.devInviteLink}</a>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function AcceptInvite({ token, onActivated }) {
  const [info, setInfo] = useState(null);
  const [error, setError] = useState("");
  const [name, setName] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    fetch(`${API_BASE}/auth/invite/${token}`).then(async r => {
      const data = await r.json();
      if (!r.ok) throw new Error(data.error);
      setInfo(data);
    }).catch(e => setError(e.message));
  }, [token]);

  async function submit(e) {
    e.preventDefault();
    setError("");
    if (password.length < 6) return setError("Password must be at least 6 characters");
    if (password !== confirm) return setError("Passwords don't match");
    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/auth/accept-invite`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, name, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      onActivated(data.token, data.user);
    } catch (err) { setError(err.message); } finally { setLoading(false); }
  }

  return (
    <div className="min-h-screen w-full flex items-center justify-center relative overflow-hidden"
         style={{ background: "radial-gradient(circle at 20% 20%, #1c2140 0%, #0b0d18 60%)" }}>
      <div className="relative z-10 glass border border-white/10 rounded-2xl p-8 w-[380px] shadow-2xl fade-in">
        <div className="flex items-center gap-2 mb-4">
          <div className="w-9 h-9 rounded-lg flex items-center justify-center text-white font-bold" style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>IN</div>
          <span className="text-xl font-semibold tracking-tight">Inventory</span>
        </div>

        {!info && !error && <Loading />}
        {error && <div className="text-rose-400 text-sm">{error}</div>}

        {info && (
          <form onSubmit={submit}>
            <p className="text-slate-400 text-sm mb-4">Activating account for <span className="text-slate-200">{info.email}</span></p>
            <label className="text-xs uppercase tracking-wide text-slate-400">Your name</label>
            <input value={name} onChange={e=>setName(e.target.value)} className="w-full mt-1 mb-4 px-3 py-2.5 rounded-lg bg-white/5 border border-white/10 focus:border-emerald-400 text-sm" />
            <label className="text-xs uppercase tracking-wide text-slate-400">Create a password</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full mt-1 mb-4 px-3 py-2.5 rounded-lg bg-white/5 border border-white/10 focus:border-emerald-400 text-sm" />
            <label className="text-xs uppercase tracking-wide text-slate-400">Confirm password</label>
            <input type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} className="w-full mt-1 mb-2 px-3 py-2.5 rounded-lg bg-white/5 border border-white/10 focus:border-emerald-400 text-sm" />
            {error && <div className="text-rose-400 text-xs mt-2">{error}</div>}
            <button disabled={loading} className="w-full mt-5 py-2.5 rounded-lg font-medium text-sm text-white transition hover:opacity-90 disabled:opacity-60"
              style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>
              {loading ? "Creating account…" : "Create account & log in"}
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------
// Small UI atoms
// ---------------------------------------------------------------------
function StatCard({ icon, value, label, color }) {
  return (
    <div className="glass border border-white/10 rounded-xl p-4 flex flex-col items-center text-center gap-2 fade-in hover:border-white/20 transition">
      <div className="w-11 h-11 rounded-full flex items-center justify-center text-lg" style={{ background: color }}>{icon}</div>
      <div className="text-2xl font-semibold">{value}</div>
      <div className="text-xs text-slate-400">{label}</div>
    </div>
  );
}

function StatusPill({ status }) {
  const map = {
    "Available": "bg-emerald-500/15 text-emerald-400",
    "Out of Stock": "bg-rose-500/15 text-rose-400",
    "Waiting for Manager": "bg-amber-500/15 text-amber-400",
    "Damaged": "bg-orange-500/15 text-orange-400",

function Modal({ title, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 fade-in" onClick={onClose}>
      <div className={`glass border border-white/10 rounded-2xl p-6 ${wide ? "w-[640px]" : "w-[420px]"} max-h-[85vh] overflow-y-auto scrollbar-thin`}
           style={{ background: "#141726" }} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-lg font-semibold">{title}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-white text-xl leading-none">×</button>
        </div>
        {children}

function Field({ label, children }) {
  return <div className="mb-3"><label className="text-xs text-slate-400 block mb-1">{label}</label>{children}</div>;
}
const inputCls = "w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 focus:border-emerald-400 text-sm";

// ---------------------------------------------------------------------
// Chart components (Chart.js wrappers)
// ---------------------------------------------------------------------
function useChart(ref, config) {
  useEffect(() => {
    if (!ref.current) return;
    const chart = new Chart(ref.current, config);
    return () => chart.destroy();
  }, [JSON.stringify(config.data)]);
}

function BarChart({ labels, datasets, height=220 }) {
  const ref = useRef();
  useChart(ref, {
    type: "bar",
    data: { labels, datasets },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#94a3b8" }, grid: { display: false } },
        y: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(255,255,255,0.05)" } },
      },
    },
  });
  return <canvas ref={ref} height={height}></canvas>;
}

function DoughnutChart({ labels, data, colors, height=220 }) {
  const ref = useRef();
  useChart(ref, {
    type: "doughnut",
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
    options: { plugins: { legend: { position: "bottom", labels: { color: "#cbd5e1", boxWidth: 10, padding: 12 } } }, cutout: "65%" },
  });
  return <canvas ref={ref} height={height}></canvas>;
}

function LineChart({ labels, data, height=220 }) {
  const ref = useRef();
  useChart(ref, {
    type: "line",
    data: { labels, datasets: [{ data, borderColor: "#22c55e", backgroundColor: "rgba(34,197,94,0.15)", fill: true, tension: 0.35, pointRadius: 3 }] },
    options: {
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: "#94a3b8" }, grid: { display: false } }, y: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(255,255,255,0.05)" } } },
    },
  });
  return <canvas ref={ref} height={height}></canvas>;
}

// ---------------------------------------------------------------------
// Dashboard
// ---------------------------------------------------------------------
function Dashboard({ api }) {
  const [data, setData] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => { api.dashboard().then(setData).catch(e=>setError(e.message)); }, []);

  if (error) return <ErrorBox msg={error} />;
  if (!data) return <Loading />;

  const catLabels = data.inventoryStatusSummary.map(c => c.category);
  const catStock = data.inventoryStatusSummary.map(c => c.stock);
  const catColors = catLabels.map(c => CATEGORY_COLORS[c] || "#64748b");

  const statusLabels = Object.keys(data.inventoryByStatus);
  const statusData = Object.values(data.inventoryByStatus);

  return (
    <div className="fade-in space-y-6">
      <div>
        <h2 className="text-xl font-semibold">Performance Summary</h2>
        <p className="text-slate-400 text-sm">Live snapshot of your inventory, in EUR.</p>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
        <StatCard icon="📦" value={data.totalInventory} label="Total Inventory" color="linear-gradient(135deg,#06b6d4,#0ea5e9)" />
        <StatCard icon="💶" value={eur(data.inventoryValueEUR)} label="Inventory Value" color="linear-gradient(135deg,#22c55e,#10b981)" />
        <StatCard icon="🏬" value={data.totalAvailableStores} label="Available Stores" color="linear-gradient(135deg,#f59e0b,#f97316)" />
        <StatCard icon="⚠️" value={data.totalDamagedProduct} label="Damaged Product" color="linear-gradient(135deg,#ef4444,#f43f5e)" />
        <StatCard icon="↩️" value={data.totalReturnProduct} label="Return Product" color="linear-gradient(135deg,#8b5cf6,#a855f7)" />
        <StatCard icon="🔻" value={data.lowStockCount} label="Low Stock Alerts" color="linear-gradient(135deg,#eab308,#f59e0b)" />
      </div>

      <div className="grid lg:grid-cols-3 gap-5">
        <div className="glass border border-white/10 rounded-xl p-5 lg:col-span-1">
          <h4 className="font-medium mb-3 text-sm text-slate-300">Inventory by Category</h4>
          <BarChart labels={catLabels} datasets={[{ data: catStock, backgroundColor: catColors, borderRadius: 6 }]} />
        </div>
        <div className="glass border border-white/10 rounded-xl p-5 lg:col-span-1">
          <h4 className="font-medium mb-3 text-sm text-slate-300">Inventory by Status</h4>
          <DoughnutChart labels={statusLabels} data={statusData} colors={["#22c55e","#f43f5e","#f59e0b","#a855f7","#0ea5e9"]} />
        </div>
        <div className="glass border border-white/10 rounded-xl p-5 lg:col-span-1">
          <h4 className="font-medium mb-3 text-sm text-slate-300">Top Products by Stock</h4>
          <LineChart labels={data.topRequestedProducts.map(p=>p.name)} data={data.topRequestedProducts.map(p=>p.stock)} />
        </div>
      </div>
    </div>
  );
}

function Loading() {
  return <div className="flex items-center gap-2 text-slate-400 text-sm py-10 justify-center"><span className="pulse-dot">●</span> Loading…</div>;
}
function ErrorBox({ msg }) {
  return <div className="glass border border-rose-500/30 rounded-xl p-4 text-rose-300 text-sm">⚠ {msg}</div>;
}

// ---------------------------------------------------------------------
// Products page
// ---------------------------------------------------------------------
function Products({ api, user, warehouses, suppliers, dispatchers, refreshFlag, bump }) {
  const [products, setProducts] = useState([]);
  const [error, setError] = useState("");
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [stockModal, setStockModal] = useState(null); // {product, action}
  const [editProduct, setEditProduct] = useState(null);
  const [selected, setSelected] = useState({}); // { [id]: true }
  const [importResult, setImportResult] = useState(null);
  const [importError, setImportError] = useState("");
  const fileInputRef = useRef(null);

  function load() {
    const qs = [];
    if (search) qs.push(`search=${encodeURIComponent(search)}`);
    if (statusFilter) qs.push(`status=${encodeURIComponent(statusFilter)}`);
    api.products(qs.length ? `?${qs.join("&")}` : "").then(list => { setProducts(list); setSelected({}); }).catch(e=>setError(e.message));
  }
  useEffect(load, [search, statusFilter, refreshFlag]);

  const isAdmin = user.role === "admin";
  const selectedIds = Object.keys(selected).filter(id => selected[id]);
  const allSelected = products.length > 0 && selectedIds.length === products.length;

  function toggleOne(id) { setSelected(s => ({ ...s, [id]: !s[id] })); }
  function toggleAll() {
    if (allSelected) setSelected({});
    else setSelected(Object.fromEntries(products.map(p => [p.id, true])));
  }

  async function handleDelete(p) {
    if (!confirm(`Delete "${p.name}"? This cannot be undone.`)) return;
    try { await api.deleteProduct(p.id); load(); bump(); } catch (e) { alert(e.message); }
  }

  async function handleBulkDelete() {
    if (selectedIds.length === 0) return;
    if (!confirm(`Delete ${selectedIds.length} selected product(s)? This cannot be undone.`)) return;
    try { await api.bulkDeleteProducts(selectedIds); load(); bump(); } catch (e) { alert(e.message); }
  }

  function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setImportError(""); setImportResult(null);
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: async (res) => {
        try {
          const rows = res.data.map(r => ({
            name: r.name || r.Name,
            brand: r.brand || r.Brand,
            category: r.category || r.Category,
            sku: r.sku || r.SKU,
            barcode: r.barcode || r.Barcode,
            unit: r.unit || r.Unit,
            purchasePrice: r.purchasePrice || r.PurchasePrice || r.PurchasePriceEUR,
            sellingPrice: r.sellingPrice || r.SellingPrice || r.SellingPriceEUR,
            currentStock: r.currentStock || r.Stock,
            minStock: r.minStock || r.MinStock,
            warehouseId: r.warehouseId,
            supplierId: r.supplierId,
          }));
          const result = await api.bulkImportProducts(rows);
          setImportResult(result);
          load(); bump();
        } catch (err) { setImportError(err.message); }
        if (fileInputRef.current) fileInputRef.current.value = "";
      },
      error: (err) => setImportError(err.message),
    });
  }

  return (
    <div className="fade-in space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 className="text-xl font-semibold">Products</h2>

        </div>
        <div className="flex gap-2 items-center flex-wrap">
          <input placeholder="Search name / SKU / barcode…" value={search} onChange={e=>setSearch(e.target.value)}
            className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm w-56" />
          <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm">
            <option value="">All Status</option>
            <option>Available</option><option>Out of Stock</option><option>Damaged</option><option>Return</option>
          </select>
          <a href={`${API_BASE}/reports/inventory.csv`} target="_blank" className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm hover:border-emerald-400">⬇ Export CSV</a>
          {isAdmin && selectedIds.length > 0 && (
            <button onClick={handleBulkDelete} className="px-3 py-2 rounded-lg bg-rose-500/15 text-rose-400 text-sm">Delete {selectedIds.length} selected</button>
          )}
          {isAdmin && (
            <>

              <button onClick={()=>fileInputRef.current?.click()} className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm hover:border-emerald-400">⬆ Import CSV</button>
              <button onClick={()=>setShowAdd(true)} className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>+ Add Product</button>
            </>
          )}
        </div>

      {error && <ErrorBox msg={error} />}
      {importError && <ErrorBox msg={importError} />}
      {importResult && (
        <div className="glass border border-emerald-500/30 rounded-lg p-3 text-sm text-emerald-300">
          Imported {importResult.createdCount} product(s).{importResult.errorCount > 0 && ` ${importResult.errorCount} row(s) skipped (missing name/category).`}

      <div className="glass border border-white/10 rounded-xl overflow-x-auto">

          <tbody>

function StockActionModal({ api, product, action, warehouses, dispatchers, onClose, onDone }) {
  const [quantity, setQuantity] = useState(1);
  const [toWarehouseId, setToWarehouseId] = useState(warehouses[0]?.id || "");
  const [note, setNote] = useState("");
  const [price, setPrice] = useState(product.sellingPrice);
  const [customerName, setCustomerName] = useState("");
  const [dispatcherId, setDispatcherId] = useState("");
  const [error, setError] = useState("");
  const titles = { "stock-in":"Stock In", "stock-out":"Stock Out", "sale":"Record Sale", "transfer":"Transfer Stock", "damage":"Report Damaged", "return":"Process Return" };

  async function submit(e) {
    e.preventDefault();
    try {
      const payload = { quantity: Number(quantity), note };
      if (action === "transfer") payload.toWarehouseId = toWarehouseId;
      if (action === "sale") {
        payload.price = Number(price);
        payload.customerName = customerName;
        if (dispatcherId) payload.dispatcherId = dispatcherId;
      }
      await api.stockAction(product.id, action, payload);
      onDone();
    } catch (err) { setError(err.message); }
  }

  return (
    <Modal title={`${titles[action]} — ${product.name}`} onClose={onClose}>
      <form onSubmit={submit}>
        <p className="text-xs text-slate-400 mb-3">Current stock: <span className="text-slate-200 font-medium">{product.currentStock} {product.unit}</span></p>
        <Field label="Quantity"><input type="number" min="1" required className={inputCls} value={quantity} onChange={e=>setQuantity(e.target.value)} /></Field>
        {action === "transfer" && (
          <Field label="Transfer To Warehouse">
            <select className={inputCls} value={toWarehouseId} onChange={e=>setToWarehouseId(e.target.value)}>
              {warehouses.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
            </select>
          </Field>
        )}
        {action === "sale" && (
          <>
            <Field label="Sale Price (€ per unit)"><input type="number" step="0.01" min="0" className={inputCls} value={price} onChange={e=>setPrice(e.target.value)} /></Field>
            <Field label="Customer Name (optional)"><input className={inputCls} value={customerName} onChange={e=>setCustomerName(e.target.value)} /></Field>
            <Field label="Dispatcher (optional)">
              <select className={inputCls} value={dispatcherId} onChange={e=>setDispatcherId(e.target.value)}>
                <option value="">— None —</option>
                {(dispatchers||[]).map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
            </Field>
          </>
        )}
        <Field label="Note (optional)"><input className={inputCls} value={note} onChange={e=>setNote(e.target.value)} /></Field>
        {error && <div className="text-rose-400 text-xs mb-2">{error}</div>}
        <div className="flex justify-end gap-2 mt-3">
          <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg bg-white/10 text-sm">Cancel</button>
          <button className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>Confirm</button>
        </div>
      </form>
    </Modal>
  );
}

              </tr>
            ))}
            {dispatchers.length===0 && <tr><td colSpan={isAdmin?6:5} className="p-6 text-center text-slate-500">No dispatchers yet.</td></tr>}
          </tbody>
        </table>
      </div>
      {showAdd && <Modal title="Add Dispatcher" onClose={()=>setShowAdd(false)}><DispatcherForm api={api} onDone={()=>{setShowAdd(false); reload();}} onClose={()=>setShowAdd(false)} /></Modal>}
      {editDisp && <Modal title="Edit Dispatcher" onClose={()=>setEditDisp(null)}><DispatcherForm api={api} dispatcher={editDisp} onDone={()=>{setEditDisp(null); reload();}} onClose={()=>setEditDisp(null)} /></Modal>}
    </div>
  );
}
function DispatcherForm({ api, dispatcher, onDone, onClose }) {
  const [form, setForm] = useState(dispatcher || { name:"", phone:"", email:"", vehicle:"", notes:"" });
  const [error, setError] = useState("");
  const set = (k,v) => setForm(f=>({...f, [k]:v}));
  async function submit(e) {
    e.preventDefault();
    try {
      if (dispatcher) await api.updateDispatcher(dispatcher.id, form);
      else await api.createDispatcher(form);
      onDone();
    } catch (err) { setError(err.message); }
  }
  return (
    <form onSubmit={submit}>
      <Field label="Name"><input required className={inputCls} value={form.name} onChange={e=>set("name", e.target.value)} /></Field>
      <Field label="Phone"><input className={inputCls} value={form.phone} onChange={e=>set("phone", e.target.value)} /></Field>
      <Field label="Email"><input type="email" className={inputCls} value={form.email} onChange={e=>set("email", e.target.value)} /></Field>
      <Field label="Vehicle"><input className={inputCls} value={form.vehicle} onChange={e=>set("vehicle", e.target.value)} /></Field>
      <Field label="Notes"><textarea className={inputCls} rows="2" value={form.notes} onChange={e=>set("notes", e.target.value)} /></Field>
      {error && <div className="text-rose-400 text-xs mb-2">{error}</div>}
      <div className="flex justify-end gap-2 mt-3">
        <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg bg-white/10 text-sm">Cancel</button>
        <button className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>Save</button>
      </div>
    </form>
  );
}

// ---------------------------------------------------------------------
// Notifications
// ---------------------------------------------------------------------
function Notifications({ api }) {
  const [list, setList] = useState([]);
  useEffect(() => { api.notifications().then(setList).catch(()=>{}); }, []);
  const sev = { high: "border-rose-500/40 bg-rose-500/10 text-rose-300", medium: "border-amber-500/40 bg-amber-500/10 text-amber-300", low: "border-sky-500/40 bg-sky-500/10 text-sky-300" };
  return (
    <div className="fade-in space-y-3">
      <h2 className="text-xl font-semibold">Notifications</h2>
      {list.length===0 && <div className="text-slate-500 text-sm">You're all caught up 🎉</div>}
      {list.map(n=>(
        <div key={n.id} className={`border rounded-lg px-4 py-3 text-sm ${sev[n.severity]}`}>{n.message}</div>
      ))}
    </div>
  );
}

// ---------------------------------------------------------------------
// Transactions ledger — who did what, and when
// ---------------------------------------------------------------------
const TX_TYPES = ["stock-in", "stock-out", "sale", "transfer", "damage", "return"];
function Transactions({ api, warehouses }) {
  const [list, setList] = useState([]);
  const [error, setError] = useState("");
  const [type, setType] = useState("");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [search, setSearch] = useState("");

  function load() {
    const qs = [];
    if (type) qs.push(`type=${encodeURIComponent(type)}`);
    if (from) qs.push(`from=${from}`);
    if (to) qs.push(`to=${to}`);
    qs.push("limit=500");
    api.transactions(`?${qs.join("&")}`).then(setList).catch(e=>setError(e.message));
  }
  useEffect(load, [type, from, to]);

  const filtered = search
    ? list.filter(t => (t.productName||"").toLowerCase().includes(search.toLowerCase()) || (t.userName||"").toLowerCase().includes(search.toLowerCase()) || (t.customerName||"").toLowerCase().includes(search.toLowerCase()))
    : list;

  const typeColors = {
    "stock-in": "bg-emerald-500/15 text-emerald-400", "stock-out": "bg-sky-500/15 text-sky-400",
    "sale": "bg-teal-500/15 text-teal-300", "transfer": "bg-purple-500/15 text-purple-300",
    "damage": "bg-orange-500/15 text-orange-300", "return": "bg-fuchsia-500/15 text-fuchsia-300",
  };

  return (
    <div className="fade-in space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h2 className="text-xl font-semibold">Transactions</h2>
        <div className="flex gap-2 items-center flex-wrap">
          <input placeholder="Search product / user / customer…" value={search} onChange={e=>setSearch(e.target.value)}
            className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm w-56" />
          <select value={type} onChange={e=>setType(e.target.value)} className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm">
            <option value="">All Types</option>
            {TX_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          <input type="date" value={from} onChange={e=>setFrom(e.target.value)} className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm" />
          <span className="text-slate-500 text-xs">to</span>
          <input type="date" value={to} onChange={e=>setTo(e.target.value)} className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm" />
        </div>
      </div>
      {error && <ErrorBox msg={error} />}
      <div className="glass border border-white/10 rounded-xl overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-slate-400 border-b border-white/10">
              <th className="p-3">Date</th><th className="p-3">Type</th><th className="p-3">Product</th><th className="p-3">Qty</th>
              <th className="p-3">Price</th><th className="p-3">Customer</th><th className="p-3">Dispatcher</th><th className="p-3">By User</th><th className="p-3">Note</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(t=>(
              <tr key={t.id} className="border-b border-white/5 hover:bg-white/[0.03]">
                <td className="p-3 text-slate-500 whitespace-nowrap">{new Date(t.createdAt).toLocaleString()}</td>
                <td className="p-3"><span className={`px-2 py-1 rounded-full text-xs font-medium ${typeColors[t.type]||"bg-slate-500/15 text-slate-300"}`}>{t.type}</span></td>
                <td className="p-3 font-medium">{t.productName}</td>
                <td className="p-3">{t.quantity}</td>
                <td className="p-3">{t.price!=null ? eur(t.price) : "—"}</td>
                <td className="p-3">{t.customerName || "—"}</td>
                <td className="p-3">{t.dispatcherName || "—"}</td>
                <td className="p-3 text-emerald-300">{t.userName || "—"}</td>
                <td className="p-3 text-slate-400">{t.note || "—"}</td>
              </tr>
            ))}
            {filtered.length===0 && <tr><td colSpan="9" className="p-6 text-center text-slate-500">No transactions found for this filter.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------
// Reports
// ---------------------------------------------------------------------
function Reports({ warehouses }) {
  const [invFrom, setInvFrom] = useState("");
  const [invTo, setInvTo] = useState("");
  const [invWarehouse, setInvWarehouse] = useState("");
  const [txFrom, setTxFrom] = useState("");
  const [txTo, setTxTo] = useState("");
  const [txType, setTxType] = useState("");

  function invUrl() {
    const qs = [];
    if (invFrom) qs.push(`from=${invFrom}`);
    if (invTo) qs.push(`to=${invTo}`);
    if (invWarehouse) qs.push(`warehouseId=${invWarehouse}`);
    return `${API_BASE}/reports/inventory.csv${qs.length ? `?${qs.join("&")}` : ""}`;
  }
  function txUrl() {
    const qs = [];
    if (txFrom) qs.push(`from=${txFrom}`);
    if (txTo) qs.push(`to=${txTo}`);
    if (txType) qs.push(`type=${txType}`);
    return `${API_BASE}/reports/transactions.csv${qs.length ? `?${qs.join("&")}` : ""}`;
  }

  return (
    <div className="fade-in space-y-6">
      <h2 className="text-xl font-semibold">Reports</h2>

      <div className="glass border border-white/10 rounded-xl p-4 space-y-3">
        <h3 className="text-sm font-medium text-slate-300">Inventory Report</h3>
        <div className="flex gap-2 flex-wrap items-end">
          <Field label="From"><input type="date" className={inputCls} value={invFrom} onChange={e=>setInvFrom(e.target.value)} /></Field>
          <Field label="To"><input type="date" className={inputCls} value={invTo} onChange={e=>setInvTo(e.target.value)} /></Field>
          <Field label="Warehouse">
            <select className={inputCls} value={invWarehouse} onChange={e=>setInvWarehouse(e.target.value)}>
              <option value="">All Warehouses</option>
              {(warehouses||[]).map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
            </select>
          </Field>
          <a href={invUrl()} target="_blank" className="px-4 py-2 mb-3 rounded-lg glass border border-white/10 hover:border-emerald-400 text-sm">⬇ Download CSV</a>
        </div>
      </div>

      <div className="glass border border-white/10 rounded-xl p-4 space-y-3">
        <h3 className="text-sm font-medium text-slate-300">Transactions Report (sales, stock-in/out, transfers…)</h3>
        <div className="flex gap-2 flex-wrap items-end">
          <Field label="From"><input type="date" className={inputCls} value={txFrom} onChange={e=>setTxFrom(e.target.value)} /></Field>
          <Field label="To"><input type="date" className={inputCls} value={txTo} onChange={e=>setTxTo(e.target.value)} /></Field>
          <Field label="Type">
            <select className={inputCls} value={txType} onChange={e=>setTxType(e.target.value)}>
              <option value="">All Types</option>
              {TX_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
          </Field>
          <a href={txUrl()} target="_blank" className="px-4 py-2 mb-3 rounded-lg glass border border-white/10 hover:border-emerald-400 text-sm">⬇ Download CSV</a>
        </div>
      </div>

      <div className="glass border border-white/10 rounded-xl p-4">
        <h3 className="text-sm font-medium text-slate-300 mb-3">Other Reports</h3>
        <div className="flex gap-3 flex-wrap">
          <a href={`${API_BASE}/reports/suppliers.csv`} target="_blank" className="px-4 py-3 rounded-lg glass border border-white/10 hover:border-emerald-400 text-sm">⬇ Suppliers Report (CSV)</a>
        </div>
      </div>

      <p className="text-xs text-slate-500">Note: CSV downloads require an active session — open in a new tab while logged in on the same browser. To bulk-add products, use "Import CSV" on the Products page.</p>
    </div>
  );
}

// ---------------------------------------------------------------------
// App shell
// ---------------------------------------------------------------------
const NAV = [
  { key:"dashboard", label:"Dashboard", icon:"🏠" },
  { key:"products", label:"Products", icon:"📦" },
  { key:"warehouses", label:"Warehouses", icon:"🏬" },
  { key:"suppliers", label:"Suppliers", icon:"🚚" },
  { key:"dispatchers", label:"Dispatchers", icon:"🛵" },
  { key:"transactions", label:"Transactions", icon:"📒" },
  { key:"notifications", label:"Notifications", icon:"🔔" },
  { key:"reports", label:"Reports", icon:"📊" },
];

function App() {
  const [token, setToken] = useState(null);
  const [user, setUser] = useState(null);
  const [page, setPage] = useState("dashboard");
  const [warehouses, setWarehouses] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [dispatchers, setDispatchers] = useState([]);
  const [refreshFlag, setRefreshFlag] = useState(0);
  const api = useApi(token);
  const inviteToken = new URLSearchParams(window.location.search).get("invite");

  useEffect(() => { window.__token = token; }, [token]);

  useEffect(() => {
    if (!token) return;
    api.warehouses().then(setWarehouses).catch(()=>{});
    api.suppliers().then(setSuppliers).catch(()=>{});
    api.dispatchers().then(setDispatchers).catch(()=>{});
  }, [token, refreshFlag]);

  function handleLogin(t, u) { setToken(t); setUser(u); }
  function handleActivated(t, u) {
    window.history.replaceState({}, "", window.location.pathname); // clear ?invite= from the URL
    setToken(t); setUser(u);
  }
  function logout() { setToken(null); setUser(null); }
  const bump = () => setRefreshFlag(f => f+1);

  if (inviteToken && !token) return <AcceptInvite token={inviteToken} onActivated={handleActivated} />;
  if (!token || !user) return <Login onLogin={handleLogin} />;

  return (
    <div className="min-h-screen flex" style={{ background: "#0b0d18" }}>
      <aside className="w-60 shrink-0 border-r border-white/10 glass p-4 flex flex-col">
        <div className="flex items-center gap-2 mb-8 px-1">
          <div className="w-8 h-8 rounded-lg flex items-center justify-center text-white font-bold text-sm" style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>IN</div>
          <span className="font-semibold tracking-tight">Inventory</span>
        </div>
        <nav className="flex-1 space-y-1">
          {NAV.map(n => (
            <button key={n.key} onClick={()=>setPage(n.key)}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition ${page===n.key ? "bg-white/10 text-white" : "text-slate-400 hover:bg-white/5 hover:text-slate-200"}`}>
              <span>{n.icon}</span>{n.label}
            </button>
          ))}
          {user.role === "admin" && (
            <button onClick={()=>setPage("users")} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition ${page==="users" ? "bg-white/10 text-white" : "text-slate-400 hover:bg-white/5 hover:text-slate-200"}`}>
              <span>👤</span>Users
            </button>
          )}
        </nav>
        <div className="border-t border-white/10 pt-3 mt-3">
          <div className="text-sm font-medium">{user.name}</div>
          <div className="text-xs text-slate-500 mb-2 capitalize">{user.role}</div>
          <button onClick={logout} className="w-full text-left text-xs text-rose-400 hover:text-rose-300">Log out →</button>
        </div>
      </aside>

      <main className="flex-1 p-6 overflow-y-auto max-h-screen">
        {page === "dashboard" && <Dashboard api={api} />}
        {page === "products" && <Products api={api} user={user} warehouses={warehouses} suppliers={suppliers} dispatchers={dispatchers} refreshFlag={refreshFlag} bump={bump} />}
        {page === "warehouses" && <Warehouses api={api} user={user} warehouses={warehouses} reload={bump} />}
        {page === "suppliers" && <Suppliers api={api} user={user} suppliers={suppliers} reload={bump} />}
        {page === "dispatchers" && <Dispatchers api={api} user={user} dispatchers={dispatchers} reload={bump} />}
        {page === "transactions" && <Transactions api={api} warehouses={warehouses} />}
        {page === "notifications" && <Notifications api={api} />}
        {page === "reports" && <Reports warehouses={warehouses} />}
        {page === "users" && user.role === "admin" && <UsersPage api={api} token={token} />}
      </main>
    </div>
  );
}

function UsersPage({ api, token }) {
  const [users, setUsers] = useState([]);
  const [invites, setInvites] = useState([]);
  const [form, setForm] = useState({ username:"", name:"", password:"", role:"manager" });
  const [inviteForm, setInviteForm] = useState({ email:"", role:"manager" });
  const [inviteResult, setInviteResult] = useState(null);
  const [error, setError] = useState("");
  const [inviteError, setInviteError] = useState("");

  function load() {
    fetch(`${API_BASE}/users`, { headers:{Authorization:`Bearer ${token}`} }).then(r=>r.json()).then(setUsers);
    fetch(`${API_BASE}/invites`, { headers:{Authorization:`Bearer ${token}`} }).then(r=>r.json()).then(setInvites);
  }
  useEffect(load, []);

  async function submit(e) {
    e.preventDefault();
    setError("");
    try {
      const res = await fetch(`${API_BASE}/users`, { method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${token}`}, body: JSON.stringify(form) });
      if (!res.ok) throw new Error((await res.json()).error);
      setForm({ username:"", name:"", password:"", role:"manager" }); load();
    } catch (err) { setError(err.message); }
  }

  async function submitInvite(e) {
    e.preventDefault();
    setInviteError(""); setInviteResult(null);
    try {
      const res = await fetch(`${API_BASE}/invites`, { method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${token}`}, body: JSON.stringify(inviteForm) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      setInviteResult(data);
      setInviteForm({ email:"", role:"manager" });
      load();
    } catch (err) { setInviteError(err.message); }
  }

  async function revokeInvite(id) {
    await fetch(`${API_BASE}/invites/${id}`, { method:"DELETE", headers:{Authorization:`Bearer ${token}`} });
    load();
  }

  return (
    <div className="fade-in space-y-6">
      <h2 className="text-xl font-semibold">Users</h2>

      <div className="glass border border-white/10 rounded-xl p-4">
        <h3 className="text-sm font-medium text-slate-300 mb-3">Invite an employee by email</h3>
        <p className="text-xs text-slate-500 mb-3">They'll get a link to set their own password. No account exists until they use it.</p>
        <form onSubmit={submitInvite} className="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
          <div className="md:col-span-2"><Field label="Work email"><input type="email" required className={inputCls} placeholder="name@company.com" value={inviteForm.email} onChange={e=>setInviteForm({...inviteForm, email:e.target.value})} /></Field></div>
          <Field label="Role">
            <select className={inputCls} value={inviteForm.role} onChange={e=>setInviteForm({...inviteForm, role:e.target.value})}>
              <option value="manager">Manager</option><option value="admin">Admin</option>
            </select>
          </Field>
          <button className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>Send invite</button>
        </form>
        {inviteError && <div className="text-rose-400 text-xs mt-2">{inviteError}</div>}
        {inviteResult && (
          <div className="mt-3 text-xs">
            <p className="text-emerald-400">✓ {inviteResult.message}</p>
            {!inviteResult.emailSent && inviteResult.devInviteLink && (
              <div className="mt-2 p-3 rounded-lg bg-white/5 border border-white/10 break-all">
                <p className="text-slate-400 mb-1">Email isn't configured on this server yet — share this link manually to test:</p>
                <a className="text-emerald-400 underline" href={inviteResult.devInviteLink}>{inviteResult.devInviteLink}</a>
              </div>
            )}
          </div>
        )}
      </div>

      {invites.filter(i=>!i.used).length > 0 && (
        <div className="glass border border-white/10 rounded-xl p-4">
          <h3 className="text-sm font-medium text-slate-300 mb-3">Pending invites</h3>
          <table className="w-full text-sm">
            <thead><tr className="text-left text-slate-400 border-b border-white/10"><th className="p-2">Email</th><th className="p-2">Role</th><th className="p-2">Expires</th><th className="p-2"></th></tr></thead>
            <tbody>
              {invites.filter(i=>!i.used).map(i=>(
                <tr key={i.id} className="border-b border-white/5">
                  <td className="p-2">{i.email}</td><td className="p-2 capitalize">{i.role}</td>
                  <td className="p-2 text-slate-500">{new Date(i.expiresAt).toLocaleDateString()}</td>
                  <td className="p-2"><button onClick={()=>revokeInvite(i.id)} className="text-rose-400 text-xs hover:text-rose-300">Revoke</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <div className="glass border border-white/10 rounded-xl p-4">
        <h3 className="text-sm font-medium text-slate-300 mb-3">All users</h3>
        <table className="w-full text-sm mb-4">
          <thead><tr className="text-left text-slate-400 border-b border-white/10"><th className="p-2">Username</th><th className="p-2">Name</th><th className="p-2">Role</th></tr></thead>
          <tbody>{users.map(u=>(<tr key={u.id} className="border-b border-white/5"><td className="p-2">{u.username}</td><td className="p-2">{u.name}</td><td className="p-2 capitalize">{u.role}</td></tr>))}</tbody>
        </table>
        <h3 className="text-sm font-medium text-slate-300 mb-3 border-t border-white/10 pt-4">Or create an account directly (no email needed)</h3>
        <form onSubmit={submit} className="grid grid-cols-2 md:grid-cols-4 gap-3 items-end">
          <Field label="Username"><input className={inputCls} value={form.username} onChange={e=>setForm({...form, username:e.target.value})} required /></Field>
          <Field label="Name"><input className={inputCls} value={form.name} onChange={e=>setForm({...form, name:e.target.value})} /></Field>
          <Field label="Password"><input type="password" className={inputCls} value={form.password} onChange={e=>setForm({...form, password:e.target.value})} required /></Field>
          <Field label="Role">
            <select className={inputCls} value={form.role} onChange={e=>setForm({...form, role:e.target.value})}>
              <option value="manager">Manager</option><option value="admin">Admin</option>
            </select>
          </Field>
          <button className="col-span-2 md:col-span-4 px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ background: "linear-gradient(135deg,#22c55e,#06b6d4)" }}>+ Add User</button>
        </form>
        {error && <div className="text-rose-400 text-xs mt-2">{error}</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
